spring.application.name=3-spring-api
spring.config.import=optional:file:.env[.properties]

# Supabase PostgreSQL Database (Session Pooler IPv4)
spring.datasource.url=${SUPABASE_DB_URL}
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=${SUPABASE_DB_USER}
spring.datasource.password=${SUPABASE_DB_PASS}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION}
jwt.cookie-name=${JWT_COOKIE}
#None para entornos cross-site entre Vercel y Render, Lax para desarrollo local
jwt.cookie-same-site=${JWT_COOKIE_SAME_SITE}
#true para entornos seguros, false para desarrollo local
jwt.cookie-secure=${JWT_COOKIE_SECURE}

# CORS Configuration
cors.allowed-origins=${CORS_ALLOWED_ORIGINS}
